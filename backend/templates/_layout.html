<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }} · 舆情风控信号台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/app.css?v=blue-console-v2">
</head>
<body class="app-body">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
      </div>
      <div>
        <strong>风控信号台</strong>
        <p class="muted small">Yuqing · RC Terminal</p>
      </div>
    </div>
    <nav class="nav" aria-label="主导航">
      {% for item in nav_items %}
        <a href="{{ item.href }}" class="nav-item {% if item.key == active_key %}active{% endif %}" data-key="{{ item.key }}">
          <span class="nav-icon" aria-hidden="true"></span>
          {{ item.label }}
        </a>
      {% endfor %}
    </nav>
    <div class="sidebar-footer">
      <p class="muted small">当前席位</p>
      <p><strong>{{ user.role_name }}</strong></p>
      <button id="logoutBtn" class="link-button">⟵ 退出登录</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar" data-edition="DAILY EDITION">
      <div>
        <h1>{{ page_title }}</h1>
      </div>
      <div class="user-info">
        <span class="topbar-clock" id="topbarClock" aria-live="off"></span>
        <div class="user-pill">
          <span class="user-avatar"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
          <span>{{ user.full_name or user.username }}</span>
        </div>
        <span class="role-pill"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg> {{ user.role_name }}</span>
      </div>
    </header>
    <section class="content">
      {% block content %}{% endblock %}
    </section>
  </main>
  <script>window.__userRole = {{ user.role | tojson }};</script>
  <script src="/static/app.js?v=2026-06-10-modal"></script>
</body>
</html>
