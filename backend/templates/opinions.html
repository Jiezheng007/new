{% extends "_layout.html" %}
{% block content %}
  <div class="users-page">
    <section class="panel">
      <header class="panel-header">
        <h2>舆情筛选</h2>
        <p class="muted small">支持按关键词、数据源、发布时间、情感、风险等级与分析状态过滤。</p>
      </header>
      <form id="opinionFilter" class="form-grid" autocomplete="off">
        <label>
          <span>关键词</span>
          <input id="op_q" name="q" type="text" maxlength="128" placeholder="在标题 / 正文中搜索">
        </label>
        <label>
          <span>数据源</span>
          <select id="op_source" name="source_id">
            <option value="">全部</option>
          </select>
        </label>
        <label>
          <span>开始时间</span>
          <input id="op_start" name="start_at" type="datetime-local">
        </label>
        <label>
          <span>结束时间</span>
          <input id="op_end" name="end_at" type="datetime-local">
        </label>
        <label>
          <span>情感倾向</span>
          <select id="op_sentiment" name="sentiment">
            <option value="">全部</option>
            <option value="positive">正面</option>
            <option value="neutral">中性</option>
            <option value="negative">负面</option>
          </select>
        </label>
        <label>
          <span>风险等级</span>
          <select id="op_risk_level" name="risk_level">
            <option value="">全部</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
            <option value="severe">严重</option>
          </select>
        </label>
        <label>
          <span>分析状态</span>
          <select id="op_status" name="analysis_status">
            <option value="">全部</option>
            <option value="success">已完成</option>
            <option value="pending">未分析</option>
            <option value="failed">失败</option>
          </select>
        </label>
        <div class="form-actions">
          <button type="submit" class="primary">查询</button>
          <button type="button" id="opReset" class="link-button">重置</button>
          <button type="button" id="opAnalyzePending" class="link-button">分析未完成项</button>
          <p id="opStatus" class="status"></p>
        </div>
      </form>
    </section>

    <section class="panel">
      <header class="panel-header">
        <h2>舆情列表</h2>
        <p class="muted small" id="opSummary">加载中...</p>
      </header>
      <div class="table-wrap">
        <table class="data-table" id="opTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>标题</th>
              <th>数据源</th>
              <th>情感</th>
              <th>风险等级</th>
              <th>分数</th>
              <th>分析状态</th>
              <th>发布时间</th>
            </tr>
          </thead>
          <tbody id="opTbody">
            <tr><td colspan="8" class="muted">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="form-actions" style="margin-top: 0.75rem;">
        <button type="button" id="opPrev" class="link-button">上一页</button>
        <span id="opPager" class="muted small"></span>
        <button type="button" id="opNext" class="link-button">下一页</button>
      </div>
    </section>
  </div>

  <div id="opinionDialog" class="dialog hidden" role="dialog" aria-modal="true">
    <div class="dialog-card" style="width: min(820px, 95vw);">
      <header>
        <h3 id="opinionDialogTitle">舆情详情</h3>
        <button type="button" class="link-button" id="opinionDialogClose">关闭</button>
      </header>
      <div id="opinionDialogBody" class="muted small" style="white-space: pre-wrap; line-height: 1.6;">加载中...</div>
      <footer class="form-actions" style="margin-top: 1rem;">
        <button type="button" id="opinionReanalyze" class="primary">重新分析</button>
        <p id="opinionReanalyzeStatus" class="status"></p>
      </footer>
    </div>
  </div>

  <script src="/static/opinions.js"></script>
{% endblock %}
