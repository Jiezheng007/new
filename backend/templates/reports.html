{% extends "_layout.html" %}
{% block content %}
  <div class="reports-page">
    <section class="panel">
      <header class="panel-header">
        <h2>生成新报告</h2>
        <p class="muted small">风控人员可以按时间范围、风险等级、关键词生成异步 Excel 报告。生成完成后,本页面会显示"已生成"链接,点击即可下载。</p>
      </header>
      <form id="reportCreate" class="form-grid" autocomplete="off">
        <label>
          <span>报告标题 (可选)</span>
          <input id="rep_title" name="title" type="text" maxlength="255" placeholder="例如:6 月高风险舆情周报">
        </label>
        <label>
          <span>备注 (可选)</span>
          <input id="rep_description" name="description" type="text" maxlength="500" placeholder="说明报告用途或筛选意图">
        </label>
        <label>
          <span>开始时间</span>
          <input id="rep_start" name="start_at" type="datetime-local">
        </label>
        <label>
          <span>结束时间</span>
          <input id="rep_end" name="end_at" type="datetime-local">
        </label>
        <label>
          <span>风险等级</span>
          <select id="rep_level" name="risk_level">
            <option value="">全部</option>
            <option value="severe">严重</option>
            <option value="high">高</option>
            <option value="medium">中</option>
            <option value="low">低</option>
          </select>
        </label>
        <label>
          <span>关键词 (匹配标题/正文)</span>
          <input id="rep_keyword" name="subject_keyword" type="text" maxlength="128" placeholder="留空表示全部">
        </label>
        <div class="form-actions">
          <button type="submit" id="repSubmit" class="primary">生成报告</button>
          <p id="repStatus" class="status"></p>
        </div>
      </form>
    </section>

    <section class="panel">
      <header class="panel-header">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 0.5rem;">
          <h2 style="margin: 0;">报告任务</h2>
          <p class="muted small" id="repSummary" style="margin: 0;">加载中...</p>
        </div>
      </header>
      <form id="reportFilter" class="form-grid" autocomplete="off" style="margin-bottom: 1rem;">
        <label>
          <span>状态</span>
          <select id="rep_f_status" name="status">
            <option value="">全部</option>
            <option value="pending">待生成</option>
            <option value="generating">生成中</option>
            <option value="completed">已生成</option>
            <option value="failed">生成失败</option>
          </select>
        </label>
        <div class="form-actions">
          <button type="submit" class="primary">查询</button>
          <button type="button" id="repReset" class="link-button">重置</button>
        </div>
      </form>
      <div class="table-wrap">
        <table class="data-table" id="repTable">
          <thead>
            <tr>
              <th>ID</th>
              <th>标题</th>
              <th>筛选条件</th>
              <th>状态</th>
              <th>匹配条数</th>
              <th>创建人</th>
              <th>创建时间</th>
              <th>完成时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="repTbody">
            <tr><td colspan="9" class="muted">加载中...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="form-actions" style="margin-top: 0.75rem;">
        <button type="button" id="repPrev" class="link-button">上一页</button>
        <span id="repPager" class="muted small"></span>
        <button type="button" id="repNext" class="link-button">下一页</button>
        <button type="button" id="repRefresh" class="link-button" style="margin-left: auto;">刷新状态</button>
      </div>
    </section>
  </div>

  <div id="reportDialog" class="dialog hidden" role="dialog" aria-modal="true">
    <div class="dialog-card" style="width: min(720px, 95vw);">
      <header>
        <h3 id="reportDialogTitle">报告详情</h3>
        <button type="button" class="link-button" id="reportDialogClose">关闭</button>
      </header>
      <div id="reportDialogBody" class="muted small" style="white-space: pre-wrap; line-height: 1.6; max-height: 65vh; overflow-y: auto;">加载中...</div>
      <footer class="form-actions" id="reportDialogFooter" style="margin-top: 1rem; display: none;">
        <a id="reportDownloadLink" class="primary" style="background: var(--primary); color: white; padding: 0.55rem 1.1rem; border-radius: 6px; font-weight: 600; text-decoration: none; display: none;" href="#" download>下载 Excel</a>
      </footer>
    </div>
  </div>

  <script src="/static/reports.js"></script>
{% endblock %}
